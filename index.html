<!DOCTYPE html>
<html>
<head>
    <title>Construire des Prompts avec des blocs</title>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/tutorial.css">
</head>
<body>
    <header class="app-header">
        <nav class="header-nav">
            <a href="https://forms.gle/ohgYscDPiTg5mqAVA" target="_blank" class="nav-survey">Répondre à l'enquête de feedback</a>
        </nav>
    </header>
    <div class="main-container">
        <div id="blocklyArea">
            <div id="blocklyDiv"></div>
        </div>

        <div id="outputDiv">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2>Prompt Généré</h2>
                <button id="clearBtn" class="btn-clear" title="Tout effacer" onclick="clearWorkspace()">🗑️</button>
                <button id="helpBtn" class="btn-help" onclick="startTutorial()">?</button>
            </div>
            <div class="progress-container" style="margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;">
                        <span>Complétude du prompt</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div style="background-color: #e0e0e0; border-radius: 10px; height: 10px; width: 100%; overflow: hidden;">
                        <div id="progressBar" style="background-color: #4CAF50; width: 0%; height: 100%; transition: width 0.5s ease-in-out;"></div>
                    </div>
                </div>
            <p>Emboîtes les blocs pour voir le résultat !</p>
            <pre id="promptResult">Le prompt s'affichera ici...</pre>
            <div style="margin-top: 15px; display: flex; justify-content: flex-end;">
                <p id="btn-copy-sidetext"></p>
                <button id="copyBtn" class="btn-copy">Copier le prompt</button>
            </div>
        </div>
    </div>

    <script src="app/blocks/ident.js"></script>
    <script src="app/blocks/rule.js"></script>
    <script src="app/blocks/content.js"></script>
    <script src="app/blocks/postcheck.js"></script>
    <script src="app/app.js"></script>
    <script src="app/tutorial.js"></script>
    <script src="app/copy.js"></script>
</body>
</html>
